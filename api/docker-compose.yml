# PostgreSQL local pour le développement : `docker compose up -d`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mutualisation
      POSTGRES_PASSWORD: mutualisation
      POSTGRES_DB: mutualisation
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
